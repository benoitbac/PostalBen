  <rect x="34" y="22" width="60" height="84" rx="5" fill="#e8e6dc"/>
  <rect x="52" y="16" width="24" height="12" rx="3" fill="#c9a227"/>
  <g fill="#34382a">
    <rect x="44" y="44" width="8" height="8" rx="2"/>
    <rect x="44" y="62" width="8" height="8" rx="2"/>
    <rect x="44" y="80" width="8" height="8" rx="2"/>
  </g>
  <g fill="#9b9c8c">
