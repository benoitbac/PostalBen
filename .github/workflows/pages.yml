name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'game/localization/vo.csv'
      - 'game/assets/audio/vo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Regenerated at deploy time so the published dashboard always reflects the
      # audio actually committed, not whatever was last computed locally.
      - name: Compute VO coverage
        shell: pwsh
        run: ./tools/Get-VoCoverage.ps1 -Quiet

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deploy
        uses: actions/deploy-pages@v4
