# Label set for PostalBen.
# Apply with:  gh label create <name> --color <c> --description <d> --force
# or in bulk:  pwsh tools/Sync-Labels.ps1

# --- Type ---------------------------------------------------------------
- name: "type: feature"
  color: "1d76db"
  description: "New gameplay, system, or capability"
- name: "type: bug"
  color: "b60205"
  description: "Something behaves incorrectly"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation, GDD, ADRs"
- name: "type: refactor"
  color: "5319e7"
  description: "Restructuring with no behaviour change"
- name: "type: tooling"
  color: "006b75"
  description: "Build, CI, scripts, dashboard"
- name: "type: design"
  color: "c5def5"
  description: "Game design question or proposal"

# --- Area ---------------------------------------------------------------
- name: "area: gameplay"
  color: "d4c5f9"
  description: "Errands, notoriety, day loop"
- name: "area: player"
  color: "d4c5f9"
  description: "Movement, camera, combat, health"
- name: "area: npc"
  color: "d4c5f9"
  description: "AI, schedules, queues, reactions"
- name: "area: police"
  color: "d4c5f9"
  description: "Pursuit, arrest, the Hunted state"
- name: "area: audio"
  color: "fbca04"
  description: "Mixer, SFX, music, ducking"
- name: "area: voice-over"
  color: "fbca04"
  description: "VO recording, pipeline, coverage"
- name: "area: localization"
  color: "fbca04"
  description: "FR/EN text and audio localization"
- name: "area: ui"
  color: "bfd4f2"
  description: "HUD, menus, subtitles"
- name: "area: level"
  color: "bfd4f2"
  description: "District, blockout, environment art"
- name: "area: dashboard"
  color: "006b75"
  description: "Progress dashboard"

# --- Priority -----------------------------------------------------------
- name: "priority: critical"
  color: "b60205"
  description: "Blocks the build or the sprint"
- name: "priority: high"
  color: "d93f0b"
  description: "Needed for the current sprint"
- name: "priority: normal"
  color: "fbca04"
  description: "Standard queue"
- name: "priority: low"
  color: "0e8a16"
  description: "Nice to have"

# --- Status -------------------------------------------------------------
- name: "status: blocked"
  color: "000000"
  description: "Waiting on something else"
- name: "status: in progress"
  color: "fef2c0"
  description: "Actively being worked on"
- name: "status: needs design"
  color: "c5def5"
  description: "Design decision required before implementation"
- name: "status: needs repro"
  color: "e4e669"
  description: "Cannot reproduce as reported"

# --- Sprint -------------------------------------------------------------
- name: "sprint: S1 foundations"
  color: "ededed"
  description: "Engine, localization, core systems"
- name: "sprint: S2 district"
  color: "ededed"
  description: "The walkable neighbourhood"
- name: "sprint: S3 people"
  color: "ededed"
  description: "NPC AI and obstruction"
- name: "sprint: S4 consequences"
  color: "ededed"
  description: "Police and combat"
- name: "sprint: S5 ben"
  color: "ededed"
  description: "Player character and likeness"
- name: "sprint: S6 week"
  color: "ededed"
  description: "Days 2-5, full VO, release"

# --- Meta ---------------------------------------------------------------
- name: "good first issue"
  color: "7057ff"
  description: "Good entry point for a new contributor"
- name: "help wanted"
  color: "008672"
  description: "Maintainer would welcome outside help"
- name: "pacifist path"
  color: "0e8a16"
  description: "Affects whether the no-kill route stays viable"
- name: "tone"
  color: "e99695"
  description: "Touches the satire boundary in GDD section 5"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already tracked elsewhere"
- name: "wontfix"
  color: "ffffff"
  description: "Deliberate decision not to act"
